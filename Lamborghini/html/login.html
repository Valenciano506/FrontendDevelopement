<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Login Lamborghini</title>
    <link href="/Lamborghini/css/login.css" rel="stylesheet"/>
    <link href="/HTML/mediaquery/js/theme/theme.css" rel="stylesheet" />
  </head>
  <body>
    <div id="contador">00:00:00</div>

    <div class="login-box">
      <h1>LAMBORGHINI</h1>

      <form action="">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="correo@lamborghini.com" />

        <label for="message">Contraseña</label>
        <input type="text" id="message" placeholder="Introduce tu contraseña" />

        <input type="submit" value="Entrar" />
      </form>
    </div>
    <div class="controls">
      <button class="theme-btn" data-theme="light">☀️ Light</button>
      <button class="theme-btn" data-theme="dark">🌙 Dark</button>
      <button class="theme-btn" data-theme="neon">🧪 Neon</button>
      <button class="theme-btn" data-theme="forest">🌲 Forest</button>
    </div>
    <canvas id="smoke_canvas"></canvas>
  </body>
  <script src="/Lamborghini/js/contador.js"></script>
  <script src="/HTML/mediaquery/js/theme/theme.js"></script>
  <script src="/HTML/smoke/smoke.js"></script>
</html>
