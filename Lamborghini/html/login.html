<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login Lamborghini</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #000000, #1a1a1a);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: #0b0b0b;
            padding: 40px;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.2);
            border: 1px solid #d4af37;
        }

        .login-box h1 {
            text-align: center;
            color: #d4af37;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            color: #ccc;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input[type="email"],
        input[type="text"] {
            padding: 10px;
            margin-bottom: 20px;
            border: none;
            border-radius: 8px;
            background: #1e1e1e;
            color: #fff;
            outline: none;
        }

        input::placeholder {
            color: #777;
        }

        input[type="submit"] {
            padding: 12px;
            background: linear-gradient(135deg, #d4af37, #ffd700);
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>LAMBORGHINI</h1>

        <form action=""> 
            <label for="email">Email</label> 
            <input type="email" id="email" placeholder="correo@lamborghini.com"> 

            <label for="message">Contraseña</label> 
            <input type="text" id="message" placeholder="Introduce tu contraseña"> 

            <input type="submit" value="Entrar"> 
        </form>
    </div>

</body>
</html>
